# Fork agent image build (W15b). Builds ONLY: no registry login, no secrets, nothing is published. Manual trigger.
# The digest it prints/uploads is the OCI manifest digest of the archive; publishing is a manual owner step (docs/fork/README.md).
name: Fork image (build only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {platform: linux/amd64, runner: ubuntu-latest, suffix: amd64}
          - {platform: linux/arm64, runner: ubuntu-24.04-arm, suffix: arm64}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build (one platform, fork-stacks)
        env:
          PLATFORM: ${{ matrix.platform }}
          OUT: target/fork-image
        run: bash scripts/fork/build-image.sh
      - uses: actions/upload-artifact@v4
        with:
          name: fork-agent-image-${{ matrix.suffix }}
          path: |
            target/fork-image/image.json
            target/fork-image/image.oci.tar
          if-no-files-found: error
